{% extends "base.html" %}

{% load static %}

{% block content %}
    <h1>{{ title }}</h1>
    <div class="my-3">
        <a class="btn btn-secondary" href="{{ back_link }}">Zurück</a>
    </div>
    <div class="row justify-content-center">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}

        <form method="post" novalidate>
            {% csrf_token %}
            {{ form.as_p }}
            <div class="text-end">
                <button type="submit" class="btn btn-primary">{{ submit_text|default:"Speichern" }}</button>
            </div>
        </form>
    </div>
{% endblock %}
