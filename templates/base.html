<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Werkstattverwaltung{% endblock %}</title>

    <style>.clickable-row {cursor: pointer;}</style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-danger">
    <div class="container">
        <a class="navbar-brand" href="{% url 'customer_list' %}">Kunden [q]</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                {% block links %}{% endblock %}
                <li class="nav-item"><a class="nav-link" href="/">Werkstatt [w]</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'inventory' %}">Lager [e]</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'supply_order_list' %}">Bestellungen [r]</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'delivery_list' %}">Lieferungen [t]</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin">Admin [a]</a></li>
            </ul>
        </div>
    </div>
</nav>
{% if messages %}
      <div class="container mt-2">
          {% for message in messages %}
              <div class="alert
            {% if message.tags %}alert-{{ message.tags }}{% else %}alert-info{% endif %} alert-dismissible fade show"
                   role="alert">
                  {{ message }}
                  <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
              </div>
          {% endfor %}
      </div>
{% endif %}
<div class="container-fluid my-3"><div class="card border-0 p-4">{% block content %}{% endblock %}</div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
<script src=" https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.1.0/js/all.min.js "></script>
<script>
    document.addEventListener('keydown', function(event) {
    event.preventDefault(); // Stop browser save
    if (event.altKey && event.key === 'q') {
        window.location.href = "/customers/";
    } else if (event.altKey && event.key === 'w') {
        window.location.href = "/";
    } else if (event.altKey && event.key === 'e') {
        window.location.href = "/lager";
    } else if (event.altKey && event.key === 'r') {
        window.location.href = "/bestellungen/";
    } else if (event.altKey && event.key === 't') {
        window.location.href = "/lieferungen/";
    } else if (event.altKey && event.key === 'a') {
        window.location.href = "/admin/";
    }
});
</script>
</body>
</html>
